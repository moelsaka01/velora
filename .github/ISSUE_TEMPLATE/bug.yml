name: Bug report
description: Report a problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include expected vs. actual behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Velora version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version/build
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Monitors, DPI scaling, affected app
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text